name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # Runs every day at midnight UTC
  workflow_dispatch:        # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/*.svg'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Stats Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=tamim-shadman&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github
          path: assets/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=tamim-shadman&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: assets/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit and Push Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Guard: never overwrite with an error SVG
          if grep -q "Something went wrong" assets/stats.svg 2>/dev/null; then
            echo "::warning::assets/stats.svg generated an error card (Resource not accessible). Preserving previous valid card."
            git checkout -- assets/stats.svg
          fi

          if grep -q "Something went wrong" assets/top-langs.svg 2>/dev/null; then
            echo "::warning::assets/top-langs.svg generated an error card. Preserving previous valid card."
            git checkout -- assets/top-langs.svg
          fi

          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: update GitHub stats cards [skip ci]"
          git push origin main

